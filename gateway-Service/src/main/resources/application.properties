spring.application.name=gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=booking-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://BOOKING
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/booking/**

spring.cloud.gateway.routes[1].id=Inventory-service
spring.cloud.gateway.routes[1].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/inventory/**